  <g transform="translate(75 42)" class="card"><rect width="215" height="128" rx="14"/><text x="24" y="34" class="text mid">Test Case</text><text x="24" y="68" class="text small">TC-001  로그인 기능</text><rect x="164" y="53" width="36" height="20" rx="5" fill="#ecfdf5"/><text x="171" y="68" class="text tiny ok">Pass</text><text x="24" y="96" class="text small">TC-002  장바구니 담기</text><rect x="164" y="81" width="30" height="20" rx="5" fill="#fff1f2"/><text x="171" y="96" class="text tiny bad">Fail</text><text x="24" y="124" class="text small">TC-003  결제 프로세스</text></g>
  <g transform="translate(320 115)" class="card"><rect width="190" height="105" rx="14"/><text x="22" y="32" class="text mid"><tspan fill="#ef4444">△</tspan> Bug Report</text><text x="22" y="62" class="text small">로그인 시 간헐적 오류 발생</text><text x="22" y="88" class="text small">Severity</text><text x="92" y="88" class="text small">High</text><text x="22" y="112" class="text small">Status</text><text x="92" y="112" class="text small">In Progress</text></g>
  <g transform="translate(555 38)" class="card"><rect width="160" height="130" rx="14"/><text x="22" y="32" class="text mid">Test Execution</text><circle cx="65" cy="78" r="34" fill="none" stroke="#e7eef7" stroke-width="14"/><path d="M65 44a34 34 0 1 1-30 50" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/><text x="48" y="84" class="text mid">72%</text><circle cx="112" cy="58" r="4" class="ok"/><text x="123" y="62" class="text tiny">Passed 72%</text><circle cx="112" cy="80" r="4" class="bad"/><text x="123" y="84" class="text tiny">Failed 18%</text><circle cx="112" cy="102" r="4" fill="#64748b"/><text x="123" y="106" class="text tiny">Blocked 5%</text></g>
  <g transform="translate(115 230)" class="card"><rect width="160" height="150" rx="14"/><text x="22" y="33" class="text mid">Checklist</text><g class="text small"><rect x="23" y="55" width="14" height="14" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M26 62l4 4 8-10" fill="none" stroke="#2563eb" stroke-width="2"/><text x="48" y="68">기능 테스트</text><rect x="23" y="83" width="14" height="14" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M26 90l4 4 8-10" fill="none" stroke="#2563eb" stroke-width="2"/><text x="48" y="96">UI/UX 검증</text><rect x="23" y="111" width="14" height="14" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M26 118l4 4 8-10" fill="none" stroke="#2563eb" stroke-width="2"/><text x="48" y="124">호환성 테스트</text></g></g>
