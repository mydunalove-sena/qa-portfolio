<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="QA testing dashboard illustration">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f2344" flood-opacity=".10"/></filter>
    <style>
      .card{fill:#fff;stroke:#dce5f2;stroke-width:1.5;filter:url(#shadow)}
      .muted{fill:#eef4fb}.line{stroke:#b7c7dd;stroke-width:2;stroke-dasharray:5 7;fill:none}.navy{fill:#0f2344}.blue{fill:#2563eb}.pale{fill:#eff6ff}.text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#0f2344}.small{font-size:14px}.mid{font-size:18px;font-weight:700}.tiny{font-size:12px}.ok{fill:#16a34a}.bad{fill:#ef4444}.warn{fill:#f59e0b}
    </style>
  </defs>
  <path d="M80 250 C140 110 280 80 390 145 C480 200 545 70 680 150 C800 225 695 455 500 445 C360 438 315 365 205 405 C65 455 20 360 80 250Z" fill="#f6f9fd"/>
  <path class="line" d="M190 145H70v210h145M330 175H505v95H640"/>
